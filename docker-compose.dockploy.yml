version: '3.8'

services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: apidian_nginx
    working_dir: /var/www/html
    # Puerto 80 NO se expone - Dockploy maneja el proxy
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apidian.rule=Host(`apidian2.gestionxpress.app`)"
      - "traefik.http.routers.apidian.entrypoints=websecure"
      - "traefik.http.routers.apidian.tls.certresolver=letsencrypt"
      - "traefik.http.services.apidian.loadbalancer.server.port=80"
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/sites-available:/etc/nginx/conf.d
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    depends_on:
      - php
    networks:
      - api_dian
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: apidian_php
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:cached
      - php_sessions:/tmp
      - composer_cache:/root/.composer
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api_dian
    environment:
      - APP_NAME=${APP_NAME:-APIDIAN}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - FORCE_HTTPS=${FORCE_HTTPS:-false}
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Bogota}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-apidian}
      - DB_USERNAME=${DB_USERNAME:-apidian}
      - DB_PASSWORD=${DB_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - CACHE_DRIVER=${CACHE_DRIVER:-file}
      - SESSION_DRIVER=${SESSION_DRIVER:-file}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-sync}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - ALLOW_PUBLIC_DOWNLOAD=${ALLOW_PUBLIC_DOWNLOAD:-true}
      - ALLOW_PUBLIC_REGISTER=${ALLOW_PUBLIC_REGISTER:-true}
      - VALIDATE_BEFORE_SENDING=${VALIDATE_BEFORE_SENDING:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mariadb:
    image: mariadb:10.3
    container_name: apidian_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: apidian
      MYSQL_USER: apidian
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_HOST: '%'
      TZ: America/Bogota
    ports:
      - "3307:3306"
    volumes:
      - apidian_mysql_data:/var/lib/mysql
      - ./docker/mariadb/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - api_dian
    command: >
      --character-set-server=utf8
      --collation-server=utf8_spanish_ci
      --max-connections=200
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --skip-name-resolve
      --default-time-zone='-05:00'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: apidian_redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    volumes:
      - redis_data:/data
    networks:
      - api_dian
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  api_dian:
    driver: bridge

volumes:
  apidian_mysql_data:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local
  nginx_logs:
    driver: local
  php_sessions:
    driver: local
  composer_cache:
    driver: local
